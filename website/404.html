<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · Aster 星流</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 32px; text-align: center; color: #e9eff9;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 600px at 20% 0%, rgba(76,154,255,.16), transparent 60%),
      radial-gradient(700px 500px at 100% 100%, rgba(56,214,184,.12), transparent 60%),
      #080d17;
  }
  .card { max-width: 520px; }
  .star {
    width: 96px; height: 96px; margin: 0 auto 28px;
    filter: drop-shadow(0 0 32px rgba(76,154,255,.5));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .code {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12px;
    letter-spacing: .28em; text-transform: uppercase; color: #38d6b8;
  }
  h1 { margin: 14px 0 12px; font-size: clamp(28px, 6vw, 40px); letter-spacing: -.02em; }
  p { margin: 0 auto 30px; max-width: 420px; color: #a6b5cb; font-size: 15px; line-height: 1.8; }
  a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 13px; color: #04121f;
    font-weight: 650; text-decoration: none;
    background: linear-gradient(105deg, #4c9aff, #2ecfc4);
    box-shadow: 0 16px 40px -18px rgba(76,154,255,.6);
    transition: transform .25s ease;
  }
  a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <svg class="star" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9CCBFF"/>
          <stop offset=".45" stop-color="#4C9AFF"/>
          <stop offset="1" stop-color="#38D6B8"/>
        </linearGradient>
      </defs>
      <path d="M100 8 C110.5 60 140 89.5 192 100 C140 110.5 110.5 140 100 192 C89.5 140 60 110.5 8 100 C60 89.5 89.5 60 100 8 Z" fill="url(#g)"/>
    </svg>
    <div class="code">404 · lost in the stars</div>
    <h1>这页文件，没送达。</h1>
    <p>页面可能已经搬走，或者链接里少了一个字符。回到首页重新出发吧。</p>
    <a href="/">← 返回 Aster 首页</a>
  </div>
</body>
</html>
