<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="asterIconTitle">
  <title id="asterIconTitle">Aster 星流</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1324"/>
      <stop offset=".55" stop-color="#080D18"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".28" cy=".18" r=".72">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity=".7"/>
      <stop offset=".55" stop-color="#4B3DB8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".82" cy=".88" r=".6">
      <stop offset="0" stop-color="#00D4FF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="130" y1="110" x2="400" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0ECFF"/>
      <stop offset=".42" stop-color="#B4C4FF"/>
      <stop offset="1" stop-color="#44E4FF"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="70" y1="210" x2="450" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B49CFF"/>
      <stop offset=".55" stop-color="#7C8BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glowA)"/>
  <rect width="512" height="512" fill="url(#glowB)"/>

  <g opacity=".6" filter="url(#softGlow)">
    <ellipse cx="256" cy="258" rx="194" ry="63" transform="rotate(-25 256 258)" fill="none" stroke="#6C7CFF" stroke-width="10"/>
  </g>
  <ellipse cx="256" cy="258" rx="194" ry="63" transform="rotate(-25 256 258)" fill="none" stroke="url(#orbitGrad)" stroke-width="6" opacity=".9"/>

  <g filter="url(#starGlow)" opacity=".65">
    <path d="M256 96 C282 176 336 230 416 256 C336 282 282 336 256 416 C230 336 176 282 96 256 C176 230 230 176 256 96 Z" fill="#8FA8FF"/>
  </g>
  <path d="M256 96 C282 176 336 230 416 256 C336 282 282 336 256 416 C230 336 176 282 96 256 C176 230 230 176 256 96 Z" fill="url(#starGrad)"/>
  <circle cx="389" cy="146" r="10" fill="#9BF4FF"/>
  <circle cx="389" cy="146" r="19" fill="#22D3EE" opacity=".18" filter="url(#softGlow)"/>
</svg>
